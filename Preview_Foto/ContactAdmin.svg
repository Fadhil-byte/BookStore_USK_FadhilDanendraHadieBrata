      <rect width="36" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(9, 7)" stroke="#475569" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="14" r="0.8"/>
        <circle cx="13" cy="14" r="0.8"/>
        <path d="M1 1h1.5l1.8 8.5a1.2 1.2 0 0 0 1.2 1h6.5a1.2 1.2 0 0 0 1.2-1l1-5H3"/>
      </g>
      <circle cx="34" cy="4" r="7.5" fill="#2563eb"/>
      <text x="34" y="7" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
    </g>

    <g transform="translate(52, 0)">
