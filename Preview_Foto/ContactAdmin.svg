    <text x="200" y="14" font-size="13.5" font-weight="500" fill="#64748b">Pesanan Saya</text>

    <g transform="translate(305, -7)">
      <rect width="105" height="30" rx="6" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
      <text x="52" y="19" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Contact Admin</text>
    </g>
  </g>

  <g transform="translate(900, 16)">
