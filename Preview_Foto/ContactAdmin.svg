<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <filter id="focus-glow" x="-2%" y="-10%" width="104%" height="120%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>

  <rect width="1280" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(100, 16)">
    <rect width="32" height="32" rx="7" fill="#2563eb"/>
    <g transform="translate(7, 7)" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 14.5v-11A1.8 1.8 0 0 1 4.3 1.7h10.4v14.6H4.3a1.8 1.8 0 0 1-1.8-1.8Z"/>
