    <text x="28" y="38" font-size="17" font-weight="700" fill="#0f172a">Riwayat Pesan &amp; Balasan Admin</text>
    <text x="292" y="115" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b">Belum ada riwayat pesan yang Anda kirimkan.</text>
  </g>

  <g transform="translate(640, 680)">
    <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">© 2026 Toko Buku USK. Sistem Pembelian &amp; Pengelolaan Katalog Buku</text>
