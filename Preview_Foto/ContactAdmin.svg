      <text x="16" y="22" font-size="11.5" font-weight="500" fill="#64748b">Identitas Pengirim:</text>
      <text x="16" y="42" font-size="13.5" font-weight="700" fill="#0f172a">Muhammad Fadhil</text>
      <text x="16" y="60" font-size="12.5" font-weight="500" fill="#2563eb">user@gmail.com</text>
    </g>

    <g transform="translate(28, 150)">
      <text x="0" y="12" font-size="12.5" font-weight="600" fill="#334155">Subjek Pesan *</text>
      <rect x="0" y="20" width="414" height="40" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#focus-glow)"/>
      <line x1="14" y1="30" x2="14" y2="50" stroke="#2563eb" stroke-width="1.5"/>
      <text x="18" y="45" font-size="12.5" font-weight="400" fill="#64748b">Contoh: Pertanyaan Stok Buku atau Status Pembayaran</text>
    </g>

    <g transform="translate(28, 230)">
      <text x="0" y="12" font-size="12.5" font-weight="600" fill="#334155">Isi Pesan *</text>
      <rect x="0" y="20" width="414" height="96" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="44" font-size="12.5" font-weight="400" fill="#94a3b8">Tuliskan pesan Anda secara jelas dan lengkap...</text>
      <line x1="404" y1="110" x2="410" y2="104" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="408" y1="110" x2="410" y2="108" stroke="#94a3b8" stroke-width="1.2"/>
    </g>

    <g transform="translate(28, 360)">
      <rect width="414" height="42" rx="8" fill="#2563eb"/>
      <text x="207" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Kirim Pesan</text>
